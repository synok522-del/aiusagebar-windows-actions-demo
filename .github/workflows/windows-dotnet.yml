name: Windows .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore tests/HelloActions.Tests/HelloActions.Tests.csproj

      - name: Build
        run: dotnet build tests/HelloActions.Tests/HelloActions.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HelloActions.Tests/HelloActions.Tests.csproj --configuration Release --no-build --verbosity normal
